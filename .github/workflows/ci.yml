name: CI

# Baut QTmux auf macOS, Windows und Linux und führt die Tests aus.
# Nimmt einen Teil der manuellen Plattform-Verifikation ab (u. a. GPU-Glyph-Atlas
# QTMUX-6 auf den jeweiligen RHI-Backends, Clink-Code QTMUX-25 auf Windows).

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

env:
  # Qt-Version bewusst gewählt (nicht beliebig aktualisierbar):
  #  - NICHT 6.8.x: dessen CMake-Config verlinkt noch das alte AGL-Framework, das aus
  #    dem macOS-SDK der aktuellen Runner entfernt wurde → „ld: framework 'AGL' not
  #    found". (Ausweichen auf macos-13 scheitert: solche Runner werden praktisch nicht
  #    mehr zugeteilt, die Jobs liefen 24 h in den Queue-Timeout.)
  #  - NICHT 6.11.x: dafür sind die WINDOWS-Metadaten über aqtinstall nicht abrufbar
  #    („Failed to locate XML data for Qt version 6.11.1"; macOS/Linux gingen). Ein
  #    neueres aqtinstall hilft nicht — 3.3.0 ist bereits das aktuellste 3.x.
  # 6.10.3 ist für alle drei Plattformen auflösbar und AGL-frei.
  QT_VERSION: 6.10.3

jobs:
  build:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: macOS,   os: macos-latest,   host: mac,     arch: clang_64 }
          - { name: Windows, os: windows-latest, host: windows, arch: win64_msvc2022_64 }
          - { name: Linux,   os: ubuntu-latest,  host: linux,   arch: linux_gcc_64 }

    steps:
      - uses: actions/checkout@v5

      # Linux: System-Bibliotheken für Qt Quick/RHI + Build-Tooling.
      - name: Linux-Systempakete
        if: matrix.host == 'linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libgl1-mesa-dev libegl1-mesa-dev libxkbcommon-dev \
            libxcb-cursor0 libfontconfig1-dev libfreetype-dev

      # Ninja wird NICHT eingerichtet: alle drei Runner-Images bringen es mit (1.13.2,
      # siehe actions/runner-images). Die frühere seanmiddleditch/gha-setup-ninja liegt
      # auch in ihrer neuesten Fassung (v6) noch auf Node 20 — der Schritt war also
      # zugleich überflüssig und die Quelle einer Deprecation-Warnung.

      # Windows: MSVC-Umgebung (vcvars) in den PATH, damit Ninja + cl gefunden werden.
      # ilammy/msvc-dev-cmd ist bis heute Node 20 (auch auf master) → Node-24-Ersatz.
      - name: MSVC-Umgebung (Windows)
        if: matrix.host == 'windows'
        # Auf den Commit-SHA gepinnt, nicht auf den Tag: Tags sind verschiebbar, ein
        # übernommenes Konto könnte v4.1.0 auf fremden Code umhängen — und dieser
        # Schritt richtet die Compilerumgebung ein. Beim Anheben den neuen SHA aus
        # `gh api repos/TheMrMilchmann/setup-msvc-dev/git/refs/tags/<tag>` holen.
        uses: TheMrMilchmann/setup-msvc-dev@368ef7d1ee4d1171b31d4a7f67f4d954f903f5a9 # v4.1.0
        with:
          arch: x64

      # Qt inkl. der von QTmux benötigten Module:
      #   qtserialport  -> SerialBackend
      #   qtshadertools -> qsb / qt_add_shaders (GPU-Glyph-Atlas, QTMUX-6)
      - name: Qt installieren
        # Auf den Commit-SHA gepinnt (gleiche Begründung wie bei setup-msvc-dev oben) —
        # dieser Schritt installiert die komplette Qt-Toolchain, die Angriffsfläche ist
        # also noch größer. `@v4` ist bei dieser Action ein *Branch*, keine feste Marke.
        # Beim Anheben: `gh api repos/jurplel/install-qt-action/tags` und den SHA des
        # gewünschten v4.x-Tags eintragen.
        uses: jurplel/install-qt-action@48d3ad6db93f3627c8ee7a0454bc6f3744f7e730 # v4.3.1
        with:
          version: ${{ env.QT_VERSION }}
          host: ${{ matrix.host }}
          target: desktop
          arch: ${{ matrix.arch }}
          modules: qtserialport qtshadertools
          cache: true

      - name: Konfigurieren
        run: cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release -DCMAKE_PREFIX_PATH="${{ env.QT_ROOT_DIR }}"

      - name: Bauen
        run: cmake --build build --parallel

      # Tests headless (offscreen-Plattform → kein Display/GPU nötig).
      - name: Tests (macOS/Linux)
        if: matrix.host != 'windows'
        env:
          QT_QPA_PLATFORM: offscreen
        run: ctest --test-dir build --output-on-failure --timeout 120

      # Windows: test_pty braucht eine echte Konsole (ConPTY-Anbindung, siehe CLAUDE.md)
      # und fällt auf dem Runner umgebungsbedingt — genau dieser eine Test wird darum
      # ausgenommen. Vorher lief der GANZE Schritt mit continue-on-error und hat damit
      # auch die 18 übrigen Windows-Tests still durchgewinkt: ein echter Regressionsfund
      # dort wäre unsichtbar geblieben.
      - name: Tests (Windows, ohne test_pty)
        if: matrix.host == 'windows'
        env:
          QT_QPA_PLATFORM: offscreen
        run: ctest --test-dir build --output-on-failure --timeout 120 -E '^test_pty$'

      # Linux-Installer: AppImage packen (QTMUX-10). Nutzt das bereits gebaute build/
      # (QTMUX_BUILD_DIR) statt neu zu bauen; linuxdeploy + Qt-Plugin holt das Skript.
      - name: AppImage packen (Linux)
        if: matrix.host == 'linux'
        env:
          QTMUX_BUILD_DIR: build
        run: |
          sudo apt-get install -y libfuse2 || true
          bash installer/build-appimage.sh 1.9.1

      - name: AppImage-Artefakt hochladen (Linux)
        if: matrix.host == 'linux'
        # Auf den Commit-SHA gepinnt wie die uebrigen Dritt-Actions (Tags sind
        # verschiebbar). v7 statt v6: v6 laeuft noch auf Node 20, das GitHub
        # abkuendigt. Anheben: `gh api repos/actions/upload-artifact/git/refs/tags/<tag>`.
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: QTmux-AppImage
          path: dist/QTmux-*-x86_64.AppImage
          if-no-files-found: error
