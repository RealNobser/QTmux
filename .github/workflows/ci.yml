name: CI

# Baut QTmux auf macOS, Windows und Linux und führt die Tests aus.
# Nimmt einen Teil der manuellen Plattform-Verifikation ab (u. a. GPU-Glyph-Atlas
# QTMUX-6 auf den jeweiligen RHI-Backends, Clink-Code QTMUX-25 auf Windows).

on:
  push:
    branches: [main]
    # Tag-Läufe (v*) sind die Release-Läufe: Job `linux-release` hängt das AppImage
    # als ASSET an das (Draft-)Release des Tags; das Release-Rezept holt es per
    # `gh release download v<ver> -p 'QTmux-*-x86_64.AppImage'` (QTMUX-136).
    # Kein Actions-Artefakt mehr — dessen Quota ist account-weit (2026-09-28 voll).
    # PROBE (QTMUX-136): `appimage-probe-*` ist VORÜBERGEHEND für genau einen
    # Probe-Lauf zugelassen; der Folgecommit entfernt es wieder.
    tags: ['v*', 'appimage-probe-*']
  pull_request:
    branches: [main]
  workflow_dispatch:

# Standard für alle Jobs: nur lesen. Schreibrecht bekommt allein `linux-release`.
permissions:
  contents: read

env:
  # Qt-Version bewusst gewählt (nicht beliebig aktualisierbar):
  #  - NICHT 6.8.x: dessen CMake-Config verlinkt noch das alte AGL-Framework, das aus
  #    dem macOS-SDK der aktuellen Runner entfernt wurde → „ld: framework 'AGL' not
  #    found". (Ausweichen auf macos-13 scheitert: solche Runner werden praktisch nicht
  #    mehr zugeteilt, die Jobs liefen 24 h in den Queue-Timeout.)
  #  - NICHT 6.11.x: dafür sind die WINDOWS-Metadaten über aqtinstall nicht abrufbar
  #    („Failed to locate XML data for Qt version 6.11.1"; macOS/Linux gingen). Ein
  #    neueres aqtinstall hilft nicht — 3.3.0 ist bereits das aktuellste 3.x.
  # 6.10.3 ist für alle drei Plattformen auflösbar und AGL-frei.
  QT_VERSION: 6.10.3

jobs:
  build:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: macOS,   os: macos-latest,   host: mac,     arch: clang_64 }
          - { name: Windows, os: windows-latest, host: windows, arch: win64_msvc2022_64 }
          - { name: Linux,   os: ubuntu-latest,  host: linux,   arch: linux_gcc_64 }

    steps:
      - uses: actions/checkout@v5

      # Linux: System-Bibliotheken für Qt Quick/RHI + Build-Tooling.
      - name: Linux-Systempakete
        if: matrix.host == 'linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libgl1-mesa-dev libegl1-mesa-dev libxkbcommon-dev \
            libxcb-cursor0 libfontconfig1-dev libfreetype-dev

      # Ninja wird NICHT eingerichtet: alle drei Runner-Images bringen es mit (1.13.2,
      # siehe actions/runner-images). Die frühere seanmiddleditch/gha-setup-ninja liegt
      # auch in ihrer neuesten Fassung (v6) noch auf Node 20 — der Schritt war also
      # zugleich überflüssig und die Quelle einer Deprecation-Warnung.

      # Windows: MSVC-Umgebung (vcvars) in den PATH, damit Ninja + cl gefunden werden.
      # ilammy/msvc-dev-cmd ist bis heute Node 20 (auch auf master) → Node-24-Ersatz.
      - name: MSVC-Umgebung (Windows)
        if: matrix.host == 'windows'
        # Auf den Commit-SHA gepinnt, nicht auf den Tag: Tags sind verschiebbar, ein
        # übernommenes Konto könnte v4.1.0 auf fremden Code umhängen — und dieser
        # Schritt richtet die Compilerumgebung ein. Beim Anheben den neuen SHA aus
        # `gh api repos/TheMrMilchmann/setup-msvc-dev/git/refs/tags/<tag>` holen.
        uses: TheMrMilchmann/setup-msvc-dev@368ef7d1ee4d1171b31d4a7f67f4d954f903f5a9 # v4.1.0
        with:
          arch: x64

      # Qt inkl. der von QTmux benötigten Module:
      #   qtserialport  -> SerialBackend
      #   qtshadertools -> qsb / qt_add_shaders (GPU-Glyph-Atlas, QTMUX-6)
      - name: Qt installieren
        # Auf den Commit-SHA gepinnt (gleiche Begründung wie bei setup-msvc-dev oben) —
        # dieser Schritt installiert die komplette Qt-Toolchain, die Angriffsfläche ist
        # also noch größer. `@v4` ist bei dieser Action ein *Branch*, keine feste Marke.
        # Beim Anheben: `gh api repos/jurplel/install-qt-action/tags` und den SHA des
        # gewünschten v4.x-Tags eintragen.
        uses: jurplel/install-qt-action@48d3ad6db93f3627c8ee7a0454bc6f3744f7e730 # v4.3.1
        with:
          version: ${{ env.QT_VERSION }}
          host: ${{ matrix.host }}
          target: desktop
          arch: ${{ matrix.arch }}
          modules: qtserialport qtshadertools
          cache: true

      - name: Konfigurieren
        run: cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release -DCMAKE_PREFIX_PATH="${{ env.QT_ROOT_DIR }}"

      - name: Bauen
        run: cmake --build build --parallel

      # Tests headless (offscreen-Plattform → kein Display/GPU nötig).
      - name: Tests (macOS/Linux)
        if: matrix.host != 'windows'
        env:
          QT_QPA_PLATFORM: offscreen
        run: ctest --test-dir build --output-on-failure --timeout 120

      # Windows: test_pty braucht eine echte Konsole (ConPTY-Anbindung, siehe CLAUDE.md)
      # und fällt auf dem Runner umgebungsbedingt — genau dieser eine Test wird darum
      # ausgenommen. Vorher lief der GANZE Schritt mit continue-on-error und hat damit
      # auch die 18 übrigen Windows-Tests still durchgewinkt: ein echter Regressionsfund
      # dort wäre unsichtbar geblieben.
      - name: Tests (Windows, ohne test_pty)
        if: matrix.host == 'windows'
        env:
          QT_QPA_PLATFORM: offscreen
        run: ctest --test-dir build --output-on-failure --timeout 120 -E '^test_pty$'

      # Linux-Installer: AppImage packen (QTMUX-10). Nutzt das bereits gebaute build/
      # (QTMUX_BUILD_DIR) statt neu zu bauen; linuxdeploy + Qt-Plugin holt das Skript.
      - name: AppImage packen (Linux)
        if: matrix.host == 'linux'
        env:
          QTMUX_BUILD_DIR: build
        run: |
          sudo apt-get install -y libfuse2 || true
          bash installer/build-appimage.sh 1.9.5

      # Das gepackte AppImage bleibt in diesem Job liegen — es wird NIRGENDS
      # hochgeladen (QTMUX-136). Der Pack-Schritt oben läuft trotzdem bei jedem
      # Lauf: er ist der Wächter für build-appimage.sh und den linuxdeploy-Pin.
      # Bis 2026-09-28 stand hier ein upload-artifact-Schritt (Tag-/Dispatch-Läufe,
      # retention 7 Tage); die Artefakt-Quota ist aber ACCOUNT-weit und war an
      # dem Tag voll (EmbyStudios 0.0.4-Tag-Lauf scheiterte dreimal allein am
      # Upload). Release-Images reisen seither als Release-Asset (Job unten).

      # Selbsttest des Upload-Skripts (Verweigerungsfälle: veröffentlichtes
      # Release, Tag auf fremdem Commit) — billig, darum bei jedem Lauf.
      - name: Selbsttest rc_release_asset (Linux)
        if: matrix.host == 'linux'
        run: python3 tools/test_rc_release_asset.py

  # ---- Release-AppImage → GitHub-Release-Asset (nur Tag-Läufe) ---------------
  # Der EINZIGE Job mit Schreibrecht, und nur, weil er nur bei Tag-Pushes
  # existiert: `permissions` kennt keine Ausdrücke, also bekommt der Tag einen
  # eigenen Job (der Matrix-Job oben bleibt bei jedem Ereignis nur-lesend).
  # Er baut Release ohne Tests neu (`needs: build` — die Tests desselben Commits
  # sind auf allen drei Plattformen grün, bevor etwas hochgeht), packt und hängt
  # das Image an das Release des Tags: fehlt es, entsteht ein DRAFT; ein schon
  # veröffentlichtes Release wird verweigert, ebenso ein Tag auf fremdem Commit
  # (tools/rc_release_asset.py, Vorlage EmbyStudio EMB-34). Nur GITHUB_TOKEN,
  # kein PAT. Release-Assets zählen nicht zur Artefakt-Quota.
  # Eine AppImage-Abnahme (Start/Build-ID im Image) hat die QTmux-CI bewusst
  # NICHT — die Build-ID misst das Release-Rezept am heruntergeladenen Asset.
  linux-release:
    name: Linux-AppImage → Release-Asset
    needs: build
    runs-on: ubuntu-latest
    # Nur Tag-Pushes; ein pull_request erreicht diesen Job nie. Der Fork-Riegel
    # steht trotzdem (Familienregel; das Repo ist öffentlich).
    if: >-
      (github.event_name != 'pull_request' ||
       github.event.pull_request.head.repo.full_name == github.repository) &&
      github.event_name == 'push' &&
      (startsWith(github.ref, 'refs/tags/v') || startsWith(github.ref, 'refs/tags/appimage-probe-'))
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5

      # Ein v<ver>-Tag muss die Version aus CMakeLists.txt nennen — sonst hinge
      # das Image unter dem Release einer anderen Version.
      - name: Version und Tag
        id: pkg
        run: |
          v="$(sed -n 's/^[[:space:]]*VERSION[[:space:]]*\([0-9.]*\).*/\1/p' CMakeLists.txt | head -1)"
          test -n "$v" || { echo "Version nicht aus CMakeLists.txt lesbar" >&2; exit 1; }
          case "$GITHUB_REF_NAME" in
            v*) test "$GITHUB_REF_NAME" = "v$v" || { echo "Tag $GITHUB_REF_NAME != v$v (CMakeLists.txt)" >&2; exit 1; } ;;
            appimage-probe-*) echo "PROBE-Tag (QTMUX-136) — kein echtes Release" ;;
            *) echo "unerwarteter Ref $GITHUB_REF_NAME" >&2; exit 1 ;;
          esac
          echo "version=$v" >> "$GITHUB_OUTPUT"
          echo "AppImage für QTmux $v aus ${GITHUB_SHA::7} → Release $GITHUB_REF_NAME"

      - name: Linux-Systempakete
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libgl1-mesa-dev libegl1-mesa-dev libxkbcommon-dev \
            libxcb-cursor0 libfontconfig1-dev libfreetype-dev libfuse2

      # Gleicher SHA-Pin wie im Matrix-Job oben (Begründung dort).
      - name: Qt installieren
        uses: jurplel/install-qt-action@48d3ad6db93f3627c8ee7a0454bc6f3744f7e730 # v4.3.1
        with:
          version: ${{ env.QT_VERSION }}
          host: linux
          target: desktop
          arch: linux_gcc_64
          modules: qtserialport qtshadertools
          cache: true

      - name: Konfigurieren (Release, ohne Tests)
        run: cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release -DQTMUX_BUILD_TESTS=OFF -DCMAKE_PREFIX_PATH="${{ env.QT_ROOT_DIR }}"

      - name: Bauen
        run: cmake --build build --parallel

      # build/ und dist/ sind git-ignoriert — der Baum bleibt sauber, die
      # Build-ID trägt kein -dirty (Statuszeile als Beleg im Log).
      - name: AppImage packen
        env:
          QTMUX_BUILD_DIR: build
        run: |
          git status --porcelain --untracked-files=no
          bash installer/build-appimage.sh "${{ steps.pkg.outputs.version }}"
          ls -l dist/
          sha256sum dist/QTmux-*-x86_64.AppImage

      # Vom Skript zurückgelesen: Name, Größe und GitHubs sha256-Digest.
      - name: AppImage → Release-Asset
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: >
          python3 tools/rc_release_asset.py upload
          --tag "$GITHUB_REF_NAME"
          --commit "$GITHUB_SHA"
          "dist/QTmux-${{ steps.pkg.outputs.version }}-x86_64.AppImage"
