; Warnungs-Konfiguration für qmllint und den QML-Language-Server (qmlls).
;
; Hier stehen NUR Abweichungen von Qts Vorgaben; alles Übrige bleibt aktiv (die volle
; Vorgabeliste liefert `qmllint --write-defaults`). Beide abgeschalteten Kategorien sind
; in diesem Projekt keine Fundstellen, sondern **bewusste Idiome** — sie würden dauerhaft
; rund 270 Meldungen erzeugen und damit die echten Befunde unsichtbar machen.

[Warnings]

; „Unqualified access" (gemessen 245×). Zwei Ursachen, beide entschieden:
;   * Die Gui-freien Registries (`Updates`, `ColorSchemes`, `Vault`, `Hotkeys`, `SettingsIo`,
;     `AgentEvents`, `Profiles`, `Plugins`, `App`, `Theme`) sind **Context-Properties** aus
;     `main.cpp` — s. Konventionen in CLAUDE.md: `qmlRegisterSingletonInstance` in die URI
;     „QTmux" kollidiert mit der Modul-Typregistrierung („TerminalItem is not a type").
;     Eine Context-Property kann das Werkzeug prinzipiell nicht kennen.
;   * Zugriffe auf Ids und Model-Rollen aus einem äußeren Component-Scope (`win`, `root`,
;     `page`, `modelData`) im Split-Baum und in den Prefs-Repeatern.
; ⚠️ Preis: Auch echte Fälle der zweiten Sorte bleiben verborgen. Wer den in CLAUDE.md
; skizzierten Abbau von `qml/Main.qml` angeht (Sidebar/Dialoge/Layout-Baum herauslösen),
; schaltet die Kategorie für diese Arbeit vorübergehend wieder ein.
UnqualifiedAccess=disable

; „Do not use comma expressions" (gemessen 25×, alle in Main.qml). Das ist das
; Revisions-Anker-Idiom: `(window.windowsRevision, window.sessionsRevision, <ausdruck>)`
; hängt eine Bindung an ein Änderungssignal, das sonst nicht Teil des Ausdrucks wäre —
; nötig, weil `groups()`/`sessionById()` Funktionen ohne Property sind (s. Feature-Referenz,
; Sidebar-Gruppen). Ohne den Anker frieren Kopfzeilen und Kontextmenüs ein.
Comma=disable

; „Expression statement has no obvious effect" (1×, PrefsWindow.qml). Dasselbe Idiom in
; Anweisungsform: `root.badgeRev` allein in `badgeFor()` erzwingt die Abhängigkeit von einem
; Änderungszähler, weil `AgentEvents.subscriptions()` eine Methode ohne Property ist.
ConfusingExpressionStatement=disable

; ⚠️ Der folgende Eintrag betrifft eine Kategorie, die nur ein NEUERES qmllint kennt als das
; der Projekt-Qt (6.10.3/6.11.1): Die VSCode-Erweiterung `theqtcompany.qt-qml` lädt sich eine
; eigene, neuere `qmlls.exe` nach `%APPDATA%\Code\User\globalStorage\…` herunter und meldet
; damit mehr als `qmllint` von der Kommandozeile. Wer nur die CLI prüft, sieht sie nie und
; hält den Eintrag für überflüssig — die Gegenprobe braucht genau jene qmlls.exe.
;
; 🔑 Nicht jede Meldung dieser neueren Fassung ist über eine Kategorie abschaltbar: Die
; Warnung „var declaration in block scope is hoisted to function scope" (17× in Main.qml)
; trägt in der LSP-Meldung KEINEN `[kategorie]`-Suffix und ließ sich weder über
; `VarUsedBeforeDeclaration` noch über `CompilerWarnings` stummschalten (beides gemessen).
; Sie ist deshalb im Code behoben — die betroffenen Schleifenzähler und blocklokalen
; Hilfsvariablen stehen jetzt als `let` da.

; „Id … shadows property" (je Prefs-Seite 1×). `CatPage` trägt `id: page`, und `PrefAnchor`
; hat eine Property `page` — der Name ist in beiden Rollen gewachsen und wird an ~20 Stellen
; in neun Kategorie-Seiten verwendet. Funktional eindeutig (die Id gewinnt, so gemeint),
; behebbar nur durch eine breite Umbenennung ohne jeden Verhaltensgewinn.
IdShadowsMember=disable
