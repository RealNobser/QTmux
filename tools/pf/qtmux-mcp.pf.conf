# QTmux — pf-Regeln für den MCP-Port (QTMUX-127)
#
# Wird als eigenes Anchor geladen (siehe install-pf-anchor.sh) und NICHT nach
# /etc/pf.conf geschrieben: macOS-Updates ersetzen diese Datei kommentarlos, und
# eine dort eingetragene Regel wäre danach still weg.
#
# Die Regeln sind eine ZWEITE Schicht. Die erste ist das Zugriffs-Token des
# Servers (Einstellungen → Agenten → MCP-Server); pf ersetzt es nicht — ein Rechner
# im erlaubten Netz kommt hier durch und braucht dann immer noch ein Token.
#
# Platzhalter werden vom Installationsskript ersetzt:
#   @@PORT@@  MCP-Port (Vorgabe 7345)
#   @@NET@@   erlaubtes Quellnetz (Vorgabe 192.168.0.0/24)
#
# ⚠️ Reihenfolge: pf wertet „last match wins" aus — die block-Regel MUSS vor der
# pass-Regel stehen, sonst blockt die letzte Regel wieder alles.
# `quick` wird bewusst NICHT verwendet, damit genau diese Reihenfolge gilt.

block in proto tcp from any to any port @@PORT@@
pass  in proto tcp from @@NET@@ to any port @@PORT@@
# Der eigene Rechner muss weiterhin an den Port kommen (lokale MCP-Clients).
pass  in proto tcp from 127.0.0.0/8 to any port @@PORT@@
